# =============================================================================
# EXPERIMENTAL WORKFLOW - Harmonica Digital Lab
# =============================================================================
name: 🔬 Experimental Scraper

on:
  schedule:
    # Всеки понеделник в 05:00 UTC (07:00 българско зимно време)
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch за тестване'
        required: true
        default: 'experimental'
        type: string
      use_crawl4ai:
        description: 'Използвай Crawl4AI вместо Playwright'
        required: false
        default: false
        type: boolean

jobs:
  experimental-scrape:
    runs-on: ubuntu-latest
    # Позволяваме scheduled и ръчни стартирания (преди беше блокирано за main branch)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: 📥 Checkout experimental code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
      
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-exp-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-exp-
      
      - name: 📚 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
          # Инсталиране на Crawl4AI и curl_cffi за експериментите
          pip install crawl4ai curl_cffi
          
          # Поправка за Ubuntu 24.04
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libatk1.0-0 libcups2 libdbus-1-3 \
            libdrm2 libgbm1 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 \
            libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 xvfb
          
          # Инсталиране на браузъри
          playwright install chromium
          
          # Инициализация на Crawl4AI
          crawl4ai-setup || true
      
      - name: ℹ️ Environment info
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          GLOVO_AUTH_TOKEN: ${{ secrets.GLOVO_AUTH_TOKEN }}
        run: |
          echo "=========================================="
          echo "EXPERIMENTAL SCRAPER v9.1.0"
          echo "=========================================="
          echo "Python: $(python --version)"
          echo "Branch: $(git branch --show-current)"
          echo "Use Crawl4AI: ${{ github.event.inputs.use_crawl4ai || 'false' }}"
          echo "Date: $(date)"
          echo "PROXY_URL set: $([ -n "$PROXY_URL" ] && echo 'YES (length: '${#PROXY_URL}')' || echo 'NO — secret missing!')"
          echo "CAPSOLVER_API_KEY set: $([ -n "$CAPSOLVER_API_KEY" ] && echo 'YES' || echo 'NO')"
          echo "GLOVO_AUTH_TOKEN set: $([ -n "$GLOVO_AUTH_TOKEN" ] && echo 'YES' || echo 'NO')"
          echo "=========================================="
      
      - name: 🔬 Run Experimental Scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          GLOVO_AUTH_TOKEN: ${{ secrets.GLOVO_AUTH_TOKEN }}
          EXPERIMENTAL_MODE: "true"
          USE_CRAWL4AI: ${{ github.event.inputs.use_crawl4ai || 'false' }}
          SHEET_TAB_SUFFIX: "_experimental"
          ALERT_EMAIL: "boris.iv@gmail.com"
        run: |
          echo "Starting experimental scraper..."
          echo "PROXY_URL check: $([ -n "$PROXY_URL" ] && echo 'SET (length: '${#PROXY_URL}')' || echo 'EMPTY')"

          if [ -f "experimental/scraper_experimental.py" ]; then
            python experimental/scraper_experimental.py
          elif [ -f "scraper_experimental.py" ]; then
            python scraper_experimental.py
          else
            echo "ERROR: scraper_experimental.py не е намерен!"
            exit 1
          fi

          echo "Experimental scraper completed!"
      
      - name: 📋 Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-results-${{ github.run_number }}
          path: |
            scraper_experimental.log
            *.log
            logs/
          if-no-files-found: warn
          retention-days: 14

# =============================================================================
# PRODUCTION WORKFLOW - Harmonica Price Tracker v10.0
# =============================================================================
# Unified async scraper (Crawl4AI + curl_cffi + Firecrawl + Claude validation).
# Стартира автоматично всеки понеделник в 05:00 UTC (07:00 българско зимно време).
# =============================================================================

name: Production Weekly Scraper

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  production-scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Crawl4AI uses Playwright internally — install browser dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libatk1.0-0 libcups2 libdbus-1-3 \
            libdrm2 libgbm1 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 \
            libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Crawl4AI needs a browser installed
          python -m crawl4ai.install || playwright install chromium || true

      - name: Environment info
        run: |
          echo "=========================================="
          echo "HARMONICA PRICE TRACKER v10.0"
          echo "=========================================="
          echo "Python: $(python --version)"
          echo "Branch: $(git branch --show-current)"
          echo "Commit: $(git log -1 --oneline)"
          echo "Date: $(date)"
          echo "=========================================="

      - name: Run Scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          GLOVO_AUTH_TOKEN: ${{ secrets.GLOVO_AUTH_TOKEN }}
        run: |
          echo "Starting scraper at $(date)"
          python scraper.py
          echo "Scraper completed at $(date)"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-logs-${{ github.run_number }}
          path: |
            scraper.log
            data/results.json
          if-no-files-found: warn
          retention-days: 7

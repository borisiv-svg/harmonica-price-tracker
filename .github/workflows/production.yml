# =============================================================================
# PRODUCTION WORKFLOW - Harmonica Price Tracker v10.2
# =============================================================================
# Unified async scraper (Crawl4AI + curl_cffi + Firecrawl + Claude validation).
# Стартира автоматично всеки понеделник в 05:00 UTC (07:00 българско зимно време).
# =============================================================================

name: Production Weekly Scraper

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run scraper from (default: current branch)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  production-scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Crawl4AI browser
        run: |
          # Crawl4AI uses Playwright internally — install matching browser + OS deps
          playwright install --with-deps chromium
          # Verify browser is installed
          python -c "from crawl4ai import AsyncWebCrawler; print('Crawl4AI OK')"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
          echo "✓ All tests passed"

      - name: Smoke test — imports & env vars
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -c "
          import sys
          ok = True
          warn = False

          # --- Critical imports ---
          checks = [
              ('crawl4ai', 'from crawl4ai import AsyncWebCrawler, BrowserConfig, CrawlerRunConfig, CacheMode'),
              ('gspread', 'import gspread'),
              ('google-auth', 'import google.auth'),
              ('beautifulsoup4', 'from bs4 import BeautifulSoup'),
              ('curl_cffi', 'from curl_cffi.requests import AsyncSession'),
              ('firecrawl-py', 'from firecrawl import FirecrawlApp'),
              ('anthropic', 'import anthropic'),
          ]
          for name, stmt in checks:
              try:
                  exec(stmt)
                  print(f'  ✓ {name}')
              except ImportError as e:
                  print(f'  ✗ {name}: {e}')
                  ok = False

          # --- Firecrawl API verification ---
          try:
              from firecrawl import FirecrawlApp
              assert hasattr(FirecrawlApp, 'scrape_url'), 'FirecrawlApp.scrape_url() missing — wrong version?'
              print(f'  ✓ FirecrawlApp.scrape_url exists')
          except Exception as e:
              print(f'  ✗ Firecrawl API check: {e}')
              ok = False

          # --- Required env vars ---
          import os
          required = ['GOOGLE_CREDENTIALS', 'SPREADSHEET_ID']
          important = ['FIRECRAWL_API_KEY', 'ANTHROPIC_API_KEY']
          for var in required:
              if os.environ.get(var):
                  print(f'  ✓ {var} set')
              else:
                  print(f'  ✗ {var} MISSING (required)')
                  ok = False
          for var in important:
              if os.environ.get(var):
                  print(f'  ✓ {var} set')
              else:
                  print(f'  ⚠ {var} not set (some features disabled)')
                  warn = True

          if not ok:
              print('\n❌ Smoke test FAILED — fix import/env errors above')
              sys.exit(1)
          elif warn:
              print('\n⚠ Smoke test PASSED with warnings')
          else:
              print('\n✓ Smoke test PASSED')
          "

      - name: Environment info
        run: |
          echo "=========================================="
          echo "HARMONICA PRICE TRACKER v10.2"
          echo "=========================================="
          echo "Python: $(python --version)"
          echo "Branch: $(git branch --show-current)"
          echo "Commit: $(git log -1 --oneline)"
          echo "Date: $(date)"
          echo "=========================================="

      - name: Run Scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GLOVO_AUTH_TOKEN: ${{ secrets.GLOVO_AUTH_TOKEN }}
        run: |
          echo "Starting scraper at $(date)"
          python scraper.py
          echo "Scraper completed at $(date)"

      - name: Commit updated product list
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/products/harmonica_products.json data/run_history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update product list & run history [skip ci]"
            git push
            echo "Data files committed"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-logs-${{ github.run_number }}
          path: |
            scraper.log
            data/results.json
          if-no-files-found: warn
          retention-days: 7
